# Loaded by jv. With the mouse on, scrolling puts the pane in copy mode, and there Esc only left
# copy mode: Claude kept working (live 2026-09-28). Esc now leaves copy mode AND reaches Claude.
bind -T copy-mode Escape send-keys -X cancel \; send-keys Escape
bind -T copy-mode-vi Escape send-keys -X cancel \; send-keys Escape

# Clickable "zitto" button in the status bar: silences the voice and empties the queue.
# Clicks anywhere else on the status bar keep tmux's default (select window).
set status-right "#[range=user|stopvoce]#[reverse] ■ zitto #[noreverse]#[norange]  🎙  hey jarvis "
bind -n MouseDown1Status if -F "#{==:#{mouse_status_range},stopvoce}" "run-shell -b '/usr/bin/python3 ~/.claude/hooks/voice_speak.py stop'" "switch-client -t ="
